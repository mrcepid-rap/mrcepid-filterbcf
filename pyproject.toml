[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrcepid-filterbcf"
version = "2.2.0"
description = "Filter a target BCF according to parameters set by MRC Epidemiology"
readme = "Readme.md"
authors = [
    { name = "Eugene Gardner", email = "eugene.gardner@mrc-epid.cam.ac.uk" },
    { name = "Alish Palmos", email = "alish.palmos@insmed.com" }
]
requires-python = ">=3.8.10,<3.9"
dependencies = [
    "dxpy==0.346.0",
    "general-utilities @ git+https://github.com/mrcepid-rap/general_utilities.git@v2.0.0",
    "pysam~=0.21.0",
    "pytest==7.4.4",
    "pytest-cov~=5.0",
    "sh~=2.0.6"
]

[tool.coverage.run]
omit = [
    "test/*", # Exclude all test files
    "tests/*" # If your tests folder is named "tests"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bcfsplitter*"]